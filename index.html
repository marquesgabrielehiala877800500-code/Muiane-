<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ehiala's Deck - Pedidos</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #25D366; /* Verde WhatsApp */
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--text-primary);
        }

        header p {
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-top: 4px;
            font-weight: 500;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 110px; /* Espaço para o rodapé fixo */
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-info h3 {
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .product-info .price {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: bold;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-control button {
            background-color: #333;
            color: white;
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity-control button:active {
            background-color: var(--accent-color);
            color: #000;
        }

        .quantity-control span {
            font-size: 1rem;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        /* Rodapé fixo com o resumo do pedido */
        .cart-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a1a1a;
            border-top: 1px solid var(--border-color);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 1.05rem;
        }

        .btn-whatsapp {
            width: 100%;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: opacity 0.2s;
        }

        .btn-whatsapp:active {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ehiala's Deck</h1>
        <p>Antenas • Muiane</p>
    </header>

    <div class="product-list" id="productList">
        <!-- Produtos injetados via JavaScript -->
    </div>

    <div class="cart-footer">
        <div class="cart-summary">
            <span>Total:</span>
            <strong id="totalPrice">0.00 MT</strong>
        </div>
        <button class="btn-whatsapp" onclick="sendOrderWhatsApp()">Enviar Pedido via WhatsApp</button>
    </div>

    <script>
        // Catálogo de produtos do Ehiala's Deck
        const products = [
            { id: 1, name: "Laurentina Coroa", price: 100 },
            { id: 2, name: "2M Garrafa", price: 90 },
            { id: 3, name: "Manica 330ml", price: 85 },
            { id: 4, name: "Impala", price: 75 },
            { id: 5, name: "Savanna Dry", price: 130 },
            { id: 6, name: "Dose de Amarula", price: 150 },
            { id: 7, name: "Água Mineral", price: 40 },
            { id: 8, name: "Espetinho Especial", price: 150 }
        ];

        let cart = {};

        function renderProducts() {
            const listContainer = document.getElementById('productList');
            listContainer.innerHTML = '';

            products.forEach(product => {
                const qty = cart[product.id] || 0;

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <div class="price">${product.price}.00 MT</div>
                    </div>
                    <div class="quantity-control">
                        <button onclick="updateQty(${product.id}, -1)">-</button>
                        <span>${qty}</span>
                        <button onclick="updateQty(${product.id}, 1)">+</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            updateTotal();
        }

        function updateQty(productId, change) {
            if (!cart[productId]) {
                cart[productId] = 0;
            }
            cart[productId] += change;

            if (cart[productId] < 0) {
                cart[productId] = 0;
            }

            renderProducts();
        }

        function updateTotal() {
            let total = 0;
            products.forEach(product => {
                const qty = cart[product.id] || 0;
                total += qty * product.price;
            });

            document.getElementById('totalPrice').innerText = `${total}.00 MT`;
        }

        function sendOrderWhatsApp() {
            let message = "Olá! Gostaria de fazer o seguinte pedido no *Ehiala's Deck*:%0A%0A";
            let hasItems = false;
            let total = 0;

            products.forEach(product => {
                const qty = cart[product.id] || 0;
                if (qty > 0) {
                    hasItems = true;
                    const subtotal = qty * product.price;
                    total += subtotal;
                    message += `- ${qty}x ${product.name} (${subtotal}.00 MT)%0A`;
                }
            });

            if (!hasItems) {
                alert("Por favor, selecione pelo menos um item antes de enviar o pedido.");
                return;
            }

            message += `%0A*Total do Pedido: ${total}.00 MT*`;

            // Substitua '258XXXXXXXXX' pelo seu número de WhatsApp real com o código do país
            const phoneNumber = "258XXXXXXXXX"; 
            const url = `https://wa.me/${phoneNumber}?text=${message}`;
            
            window.open(url, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
